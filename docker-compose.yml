version: "3"
services:
namenode:
image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
container_name: namenode
hostname: namenode
ports:
- "9870:9870" # Interface Web HDFS
- "8020:8020" # Port RPC NameNode
env_file:
- ./hadoop.env # Fichier de configuration centralisé
volumes:
- namenode_data:/hadoop/dfs/name
networks:
- hadoop-network
datanode1:
image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
container_name: datanode1
hostname: datanode1
depends_on:
- namenode
env_file:
- ./hadoop.env
volumes:
- datanode1_data:/hadoop/dfs/data
networks:
- hadoop-network
datanode2:
image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
container_name: datanode2
hostname: datanode2
depends_on:
- namenode
env_file:
- ./hadoop.env
volumes:
- datanode2_data:/hadoop/dfs/data
networks:
- hadoop-network
spark-master:
image: bde2020/spark-master:3.3.0-hadoop3.3
container_name: spark-master
ports:
- "8080:8080" # UI Spark Master
- "7077:7077" # Port Spark
networks:
- hadoop-network
spark-worker:
image: bde2020/spark-worker:3.3.0-hadoop3.3
container_name: spark-worker
depends_on:
- spark-master
environment:
- SPARK_MODE=worker
- SPARK_MASTER_URL=spark://spark-master:7077
networks:
- hadoop-network
volumes:
namenode_data:
datanode1_data:
datanode2_data:
networks:
hadoop-network:
driver: bridge
